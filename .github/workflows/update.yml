name: Update repository

# Rebuilds and publishes the apt repository from the newest releases. It never runs for pull requests,
# because it uses the signing key.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["sources.txt", "scripts/**", "index.html", ".github/workflows/update.yml"]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils dpkg-dev gnupg
      - name: Import the signing key
        id: key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          [ -n "$APT_GPG_PRIVATE_KEY" ] || { echo "the APT_GPG_PRIVATE_KEY secret is missing"; exit 1; }
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          echo "fingerprint=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')" >> "$GITHUB_OUTPUT"
      - name: Build the repository
        env:
          GPG_KEY_ID: ${{ steps.key.outputs.fingerprint }}
        run: scripts/build-repo.sh
      - name: Check the signature we just made
        run: |
          gpg --batch --verify site/dists/stable/InRelease
          gpg --batch --verify site/dists/stable/Release.gpg site/dists/stable/Release
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
